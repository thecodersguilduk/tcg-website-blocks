# Builds tcg-blocks.zip when a release is published and attaches it to the
# release. WordPress (via Plugin Update Checker) installs that zip as the update.
name: Build release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' tcg-blocks.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          echo "Release tag: $TAG / Plugin version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag v$TAG does not match the Version header ($VERSION) in tcg-blocks.php. Bump the version, then release again."
            exit 1
          fi

      - name: Build tcg-blocks.zip
        run: |
          mkdir -p build/tcg-blocks
          rsync -a ./ build/tcg-blocks/ \
            --exclude '.git' --exclude '.github' --exclude 'build' \
            --exclude '.gitignore' --exclude '.gitattributes' --exclude 'README.md'
          cd build && zip -qr tcg-blocks.zip tcg-blocks

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/tcg-blocks.zip --clobber
